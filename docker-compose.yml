services:
  app:
    build: .
    ports:
      - "18080:8080"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      CLIENT_DIST_DIR: /app/client/dist
      POKER_AI_ENGINE: ${POKER_AI_ENGINE:-rule}
      POKER_AI_API_BASE_URL: ${POKER_AI_API_BASE_URL:-}
      POKER_AI_API_KEY: ${POKER_AI_API_KEY:-}
      POKER_AI_API_MODEL: ${POKER_AI_API_MODEL:-}
      POKER_AI_API_TIMEOUT_MS: ${POKER_AI_API_TIMEOUT_MS:-3500}
    restart: unless-stopped
